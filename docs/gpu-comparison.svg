<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Live mpv GPU time comparison</title><desc id="desc">Two measured runs: no shader 2.01 and 1.94 milliseconds, Salow with TV Dynamic 9.31 and 9.46 milliseconds, Anime4K A+A with TV Dynamic 23.99 and 22.41 milliseconds per frame. Lower is faster.</desc>
<rect width="1000" height="340" rx="20" fill="#101321"/>
<text x="36" y="46" fill="#fff" font-family="sans-serif" font-size="26" font-weight="700">Live mpv GPU time per frame</text>
<text x="36" y="75" fill="#aab3ca" font-family="sans-serif" font-size="15">1920 × 1080 · Intel Core Ultra 5 125U · two runs · lower is faster</text>
<g font-family="sans-serif" font-size="17" fill="#e3e8f1"><text x="36" y="135">No shader</text><text x="36" y="195">Salow + TV Dynamic</text><text x="36" y="255">Anime4K A+A + TV</text></g>
<g><rect x="258" y="113" width="45" height="29" rx="5" fill="#79869d"/><rect x="258" y="173" width="215" height="29" rx="5" fill="#58bad1"/><rect x="258" y="233" width="534" height="29" rx="5" fill="#d89ac3"/></g>
<g font-family="sans-serif" font-size="16" fill="#f5f6fa"><text x="320" y="133">2.01 / 1.94 ms</text><text x="488" y="193">9.31 / 9.46 ms</text><text x="807" y="253">23.99 / 22.41 ms</text></g>
<text x="36" y="305" fill="#aab3ca" font-family="sans-serif" font-size="14">Bars use the mean of each pair. TV Dynamic was off for the no-shader run.</text>
</svg>
