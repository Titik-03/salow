# mpv 0.41+ — balanced playback for Intel Meteor Lake
vo=gpu-next
# Prefer Vulkan; allow OpenGL if Vulkan cannot initialize.
gpu-api=vulkan,opengl
# Prefer the verified Intel VA-API path; keep automatic fallback.
hwdec=vaapi,auto

# Smooth 24 fps pans on the 60 Hz display; Alt+1 toggles frame mixing, Alt+2 pan smoothing.
video-sync=display-resample
interpolation=yes
tscale=oversample

# Default: A4K sharp copy (native 1080p; Ctrl+4 switches to Anime4K A+A, Ctrl+0 turns shaders off).
glsl-shaders="~~/shaders/salow.hook:~~/shaders/tv-dynamic.glsl"

# Scaling handles any size adjustment left after Anime4K.
scale=lanczos
cscale=lanczos
dscale=mitchell
scale-antiring=0.6

# Gentle debanding preserves more texture than the old settings.
deband=no
deband-iterations=1
deband-threshold=20
deband-grain=8

# Let mpv handle source color/HDR metadata; use an ICC profile when available.
icc-profile-auto=yes

# Moderately vivid anime colors (subjective preference, not calibration).
# Keep contrast and gamma neutral to avoid extra tonal distortion.
saturation=0
contrast=0
brightness=0
gamma=0
hue=0

# Audio and subtitles
volume=100
volume-max=130
ao=pipewire
audio-channels=stereo
audio-normalize-downmix=yes
alang=jpn,ja,jp
audio-file-auto=fuzzy
sub-auto=fuzzy
sub-file-paths=srt:sub:subs:subtitles
sub-font="Noto Sans"
sub-font-size=52
sub-outline-size=3
sub-pos=95
sub-fix-timing=yes

# Playback and screenshots
save-position-on-quit=yes
# resume restores position/tracks but not the picture look or video filters, so Salow + TV dynamic always applies and smoothing (Alt+4/6) never comes back on by itself
watch-later-options=start,speed,pitch,edition,volume,mute,audio-delay,deinterlace,af,panscan,aid,vid,sid,sub-delay,sub-speed,sub-pos,sub-visibility,sub-scale,sub-use-margins,sub-ass-force-margins,sub-ass-use-video-data,sub-ass-override,secondary-sid,secondary-sub-delay,secondary-sub-pos,secondary-sub-ass-override,secondary-sub-visibility,ab-loop-a,ab-loop-b,video-aspect-override,video-aspect-method,video-unscaled,video-pan-x,video-pan-y,video-rotate,video-crop,video-zoom,video-scale-x,video-scale-y,video-align-x,video-align-y
fullscreen=yes
keep-open=yes
keep-open-pause=no
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
screenshot-format=png
screenshot-template="mpv-shot-%F-%P"
screenshot-directory=~~desktop/

# Videos smaller than 1080p: the copy is only validated at 1080p, so use Anime4K A+A (it upscales).
# --- player extras 2026-11-18 (backup: mpv.conf.before-extras-20261118) ---
# uosc draws its own control bar and progress bar, so mpv's built-in ones are switched off
osc=no
osd-bar=no
border=no
# touchscreen: send real touch positions so uosc reacts to fingers (taps still work as clicks)
native-touch=yes

[below-1080p-a4k]
profile-cond=height ~= nil and height < 1080
profile-restore=copy
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl:~~/shaders/tv-dynamic.glsl"

# --- pan smoothing 2026-11-21, toggle 2026-11-22 (backups: mpv.conf.before-*-2026112x) ---
# Off by default; Alt+2 toggles. Interpolates camera pans 24 -> 60 fps
# on the CPU before the shaders (code: ~~/vs/pansmooth_core.py); other scenes look unchanged.
# Software decoding: copy-back hardware decoding made seeking ~5x slower with a filter.
# Costs more GPU while on: Salow + TV dynamic run on 60 frames/s instead of 24.
[pan-smooth]
profile-restore=copy
hwdec=no
vf-add=@pansmooth:vapoursynth="~~/vs/pan-smooth.vpy":buffered-frames=8
