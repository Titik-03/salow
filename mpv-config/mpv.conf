# Salow playback settings
vo=gpu-next
# Let mpv choose an available graphics API.
gpu-api=auto
# Let mpv choose hardware decoding.
hwdec=auto

# Smooth 24 fps pans on the 60 Hz display; Alt+1 toggles frame mixing, Alt+2 pan smoothing.
video-sync=display-resample
interpolation=no
tscale=oversample

# Default: Salow + TV Dynamic. Ctrl+2 selects Medium; Ctrl+3 toggles the look.
glsl-shaders="~~/shaders/salow.hook:~~/shaders/tv-dynamic.glsl"

# Scaling handles any size adjustment left after Anime4K.
scale=lanczos
cscale=lanczos
dscale=mitchell
scale-antiring=0.6

# Gentle debanding preserves more texture than the old settings.
deband=no
deband-iterations=1
deband-threshold=20
deband-grain=8

# Let mpv handle source color/HDR metadata; use an ICC profile when available.
icc-profile-auto=yes

# Moderately vivid anime colors (subjective preference, not calibration).
# Keep contrast and gamma neutral to avoid extra tonal distortion.
saturation=0
contrast=0
brightness=0
gamma=0
hue=0

# Audio and subtitles
volume=100
volume-max=130
audio-channels=stereo
audio-normalize-downmix=yes
alang=jpn,ja,jp
audio-file-auto=fuzzy
sub-auto=fuzzy
sub-file-paths=srt:sub:subs:subtitles
sub-font="Noto Sans"
sub-font-size=52
sub-border-size=3
sub-pos=95
sub-fix-timing=yes

# Playback and screenshots
save-position-on-quit=yes
# Motion and audio choices are restored by salow-controls.lua.
watch-later-options=start,speed,edition,volume,mute,audio-delay,aid,vid,sid,sub-delay,sub-pos,sub-visibility,sub-scale
fullscreen=yes
keep-open=yes
keep-open-pause=no
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
screenshot-format=png
screenshot-template="mpv-shot-%F-%P"
screenshot-directory=~~desktop/

# --- player extras 2026-11-18 (backup: mpv.conf.before-extras-20261118) ---
# uosc draws its own control bar and progress bar, so mpv's built-in ones are switched off
osc=no
osd-bar=no
border=no
