# mpv keys, rebuilt 2026-11-18 (previous file: input.conf.before-salow-20261118)
# Shaders
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/salow.hook:~~/shaders/tv-dynamic.glsl"; set saturation 0; set contrast 0; set brightness 0; set gamma 0; show-text "Salow + TV dynamic (default)"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl:~~/shaders/tv-dynamic.glsl"; set saturation 0; set contrast 0; set brightness 0; set gamma 0; show-text "Anime4K A+A + TV dynamic"
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "No shader (original)"
# Picture look (works with either shader)
CTRL+3 no-osd change-list glsl-shaders remove "~~/shaders/tv-dynamic.glsl"; set saturation 0; set contrast 0; set brightness 0; set gamma 0; show-text "Look: natural"
CTRL+4 no-osd change-list glsl-shaders remove "~~/shaders/tv-dynamic.glsl"; set saturation 20; set contrast 4; set brightness 0; set gamma 0; show-text "Look: vivid"
CTRL+5 no-osd change-list glsl-shaders remove "~~/shaders/tv-dynamic.glsl"; no-osd change-list glsl-shaders append "~~/shaders/tv-dynamic.glsl"; set saturation 0; set contrast 0; set brightness 0; set gamma 0; show-text "Look: TV dynamic"
CTRL+6 no-osd change-list glsl-shaders remove "~~/shaders/tv-dynamic.glsl"; set saturation 10; set contrast 0; set brightness 0; set gamma 0; show-text "Look: old default (saturation 10)"
# Motion
ALT+1 cycle-values interpolation "no" "yes"; show-text "Motion: frame mixing ${?interpolation==yes:ON (default)}${?interpolation==no:off (original 3:2 cadence)}"
# Alt+2: pan smoothing on/off (scripts/pan-smooth-toggle.lua, profile [pan-smooth])
ALT+2 script-message pan-smooth-toggle
# Sound
n af toggle "@norm:lavfi=[dynaudnorm=f=200:g=11:p=0.9:m=8]"; show-text "Volume balance: ${af}"
# Tab / Shift+Tab: skip 1:25 forward / back (scripts/skip-opening.lua). Double-tap left/middle/right: -10 s / pause / +10 s.

# Alt+a: cycle audio modes (Off, Cinema, Dolby Atmos, X-Fi, Razor Surround) — scripts/cinema-audio.lua
ALT+a script-binding cinema-audio-toggle
